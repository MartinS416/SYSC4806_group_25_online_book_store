<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <title>Your Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#CC0033;">
    <div class="container">
        <a class="navbar-brand" href="#">Profile</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/shop}">Shop</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cart}">Cart</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/logout}">Sign Out</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">Your Profile</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row">

        <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">

                    <h4 class="mb-3">Edit Profile</h4>

                    <form th:action="@{/profile/update}" method="post">

                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input class="form-control"
                                   name="firstName"
                                   th:value="${customer.firstName ?: ''}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Last Name</label>
                            <input class="form-control"
                                   name="lastName"
                                   th:value="${customer.lastName ?: ''}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email (read-only)</label>
                            <input class="form-control" th:value="${customer.email}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input class="form-control"
                                   name="phone"
                                   th:value="${customer.phone ?: ''}"
                                   placeholder="Enter 10-digit phone number"
                                   pattern="\d{10}"
                                   maxlength="10"
                                   minlength="10"
                                   required>
                            <div class="form-text">Must be exactly 10 digits (numbers only).</div>
                        </div>

                        <button class="btn text-white" style="background:#CC0033;" type="submit">
                            Save Changes
                        </button>

                    </form>

                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">

                    <h4 class="mb-3">Change Password</h4>

                    <form th:action="@{/profile/change-password}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Old Password</label>
                            <input type="password" name="oldPassword" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" name="newPassword" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" name="confirmPassword" class="form-control" required>
                        </div>

                        <button class="btn text-white" style="background:#CC0033;" type="submit">
                            Change Password
                        </button>

                    </form>

                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
