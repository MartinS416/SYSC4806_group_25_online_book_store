<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#CC0033;">
  <div class="container">
    <a class="navbar-brand" href="/shop">Online Bookstore</a>
  </div>
</nav>

<!-- Book Details Section -->
<div class="container mt-4">
  <div th:if="${book == null}">
    <p class="text-danger">Book not found.</p>
  </div>

  <div th:if="${book != null}" class="card p-4 shadow-sm">
    <h2 class="card-title mb-3" th:text="${book.title}">Book Title</h2>

    <p class="card-text">
      <strong>Author:</strong> <span th:text="${book.author}">Author</span><br>
      <strong>Category:</strong> <span th:text="${book.category}">Category</span><br>
      <strong>Price:</strong> $<span th:text="${book.price}">0.00</span><br>
      <strong>Stock:</strong> <span th:text="${book.stock}">0</span>
    </p>

    <form th:action="@{'/cart/add/' + ${book.id}}" method="post">
      <button type="submit" class="btn text-white border-0" style="background-color: #CC0033;">
        Add to Cart
      </button>
    </form>

    <a href="/shop" class="btn btn-secondary mt-3">Back to Shop</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
