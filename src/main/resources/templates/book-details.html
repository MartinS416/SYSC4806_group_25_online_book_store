<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .star-filled { color: #ffc107; font-size: 1.2rem; }
    .star-empty { color: #e0e0e0; font-size: 1.2rem; }
    .rating-bar-bg { background: #eee; height: 8px; width: 200px; border-radius: 5px; display: inline-block; }
    .rating-bar-fill { background: #444; height: 8px; border-radius: 5px; }
    .review-card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; background: white; }
  </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#CC0033;">
  <div class="container">
    <a class="navbar-brand" href="/shop">Online Bookstore</a>
  </div>
</nav>

<!-- Book Details Section -->
<div class="container mt-4">

  <div th:if="${book == null}">
    <p class="text-danger">Book not found.</p>
  </div>

  <div th:if="${book != null}" class="card p-4 shadow-sm">
    <h2 class="card-title mb-3" th:text="${book.title}">Book Title</h2>

    <p class="card-text">
      <strong>Author:</strong> <span th:text="${book.author}">Author</span><br>
      <strong>Category:</strong> <span th:text="${book.category}">Category</span><br>
      <strong>Price:</strong> $<span th:text="${book.price}">0.00</span><br>
      <strong>Stock:</strong> <span th:text="${book.stock}">0</span>
    </p>

    <form th:action="@{'/cart/add/' + ${book.id}}" method="post">
      <button type="submit" class="btn text-white border-0" style="background-color: #CC0033;">
        Add to Cart
      </button>
    </form>

    <a href="/shop" class="btn btn-secondary mt-3">Back to Shop</a>
  </div>


  <!-- ========================= -->
  <!-- ⭐ REVIEWS SECTION BELOW ⭐ -->
  <!-- ========================= -->

  <div class="card mt-4 p-4 shadow-sm">

    <h3 class="mb-3">Reviews</h3>

    <!-- Review Snapshot -->
    <div class="row">
      <div class="col-md-4 text-center">
        <h1 th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">0.0</h1>

        <!-- Stars -->
        <div>
          <span th:each="i : ${#numbers.sequence(1,5)}"
                th:classappend="${i <= averageRating} ? 'star-filled' : 'star-empty'">
            ★
          </span>
        </div>

        <p class="text-muted" th:text="${reviews.size()} + ' reviews'"></p>
      </div>

      <!-- Breakdown bars -->
      <div class="col-md-8">
        <div th:each="i : ${#numbers.sequence(5,1)}" class="mb-2 d-flex align-items-center">
          <span class="me-2" th:text="${i} + '★'"></span>

          <div class="rating-bar-bg">
            <div class="rating-bar-fill"
                 th:style="'width:' + (breakdown[5 - i] * 100.0 / (reviews.size() == 0 ? 1 : reviews.size())) + '%'">
            </div>
          </div>

          <span class="ms-2" th:text="'(' + breakdown[5 - i] + ')'"></span>
        </div>
      </div>
    </div>

    <hr>

    <!-- Reviews List -->
    <div th:each="rev : ${reviews}" class="review-card mt-3">
      <!-- Star Rating -->
      <div>
        <span th:each="i : ${#numbers.sequence(1,5)}"
              th:classappend="${i <= rev.rating} ? 'star-filled' : 'star-empty'">
          ★
        </span>
      </div>

      <p class="mt-2 mb-1"><strong th:text="${rev.reviewerName}">Reviewer</strong></p>
      <p th:text="${rev.content}">Review text...</p>
    </div>

    <hr>

    <!-- Write a Review Form -->
    <h4 class="mt-4">Write a Review</h4>

    <form th:action="@{'/books/' + ${book.id} + '/reviews'}" method="post" class="mt-3">

      <div class="mb-3">
        <label class="form-label">Your Name</label>
        <input type="text" name="reviewerName" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Rating</label>
        <select name="rating" class="form-select" required>
          <option value="5">★★★★★ (5 stars)</option>
          <option value="4">★★★★☆ (4 stars)</option>
          <option value="3">★★★☆☆ (3 stars)</option>
          <option value="2">★★☆☆☆ (2 stars)</option>
          <option value="1">★☆☆☆☆ (1 star)</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Your Review</label>
        <textarea name="content" class="form-control" rows="4" required></textarea>
      </div>

      <button type="submit" class="btn text-white" style="background-color: #CC0033;">
        Submit Review
      </button>

    </form>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
