<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Your Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .popup-container {
          position: fixed; /* Fixes the popup relative to the viewport */
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent overlay */
          display: flex; /* Enables Flexbox for centering */
          justify-content: center; /* Horizontally centers the content */
          align-items: center; /* Vertically centers the content */
          z-index: 1000; /* Ensures the popup is on top of other content */
          /* Initially hide the popup and show it with JavaScript */
          visibility: visible;
          opacity: 1;
          transition: visibility 0s, opacity 0.3s ease-in-out;
        }

        .popup-container.show {
          visibility: visible;
          opacity: 1;
        }

        .popup-content {
          padding: 20px;
          border-radius: 8px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
          max-width: 500px; /* Optional: limit popup width */
          text-align: center; /* Optional: center text within popup */
          background-color: white;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #CC0033;">
    <div class="container">
        <a class="navbar-brand" href="#">Online Bookstore</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/shop">Shop</a></li>
                <li class="nav-item"><a class="nav-link active" href="/cart">Cart</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/login}">Sign In / Sign Up</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="popup-container" id="myForm">
    <div class="popup-content">
        <h1>Error</h1>
        <p>payment could not be processed</p>
        <button type="button" class="btn cancel" onclick="closeForm()">Close</button>
    </div>
</div>
<script>
    function openForm() {
        document.getElementById("myForm").style.display = "flex";
    }

    function closeForm() {
        document.getElementById("myForm").style.display = "none";
    }

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    if(urlParams.get('paid')=="false"){
        openForm();
    } else {
        closeForm();
    }
</script>
<div style="display: flex; align-items: flex-start; justify-content: center; gap: 40px; margin-top: 20px; flex-wrap: wrap;">
    <div>
        <h1>Your Cart</h1>
        <table border="1" cellpadding="5">
            <thead>
            <tr>
                <th>Title</th><th>Qty</th><th>Price ($)</th><th>Subtotal ($)</th><th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${items}">
                <td th:text="${entry.key.title}"></td>
                <td th:text="${entry.value}"></td>
                <td th:text="${#numbers.formatDecimal(entry.key.price,1,2)}"></td>
                <td th:text="${#numbers.formatDecimal(entry.key.price * entry.value,1,2)}"></td>
                <td>
                    <form th:action="@{'/cart/remove/' + ${entry.key.id}}" method="post">
                        <button type="submit">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <h3>Total: <span th:text="${#numbers.formatDecimal(total,1,2)}"></span> $</h3>

        <p><a th:href="@{/books}">Continue Shopping</a></p>
        <form th:action="@{/cart/clear}" method="post">
            <button type="submit">Clear Cart</button>
        </form>
    </div>

    <div>
        <form th:action="@{/cart/pay}" method="post" class="p-4 rounded shadow-sm bg-white" style="max-width: 400px;">
            <h5 class="mb-3 text-center">Payment Details</h5>

            <div class="mb-3">
                <label for="cardNumber" class="form-label">Card Number</label>
                <input type="text" class="form-control" id="cardNumber" name="cardNumber" maxlength="16" placeholder="1234 5678 9012 3456"
                       pattern="[0-9\s]{13,19}" inputmode="numeric" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="expiry" class="form-label">Expiry</label>
                    <input type="text" class="form-control" id="expiry" name="expiry" placeholder="MM/YY"
                           pattern="(0[1-9]|1[0-2])\/?([0-9]{2})" inputmode="numeric" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="cvv" class="form-label">CVV</label>
                    <input type="text" class="form-control" id="cvv" name="cvv" maxlength="3" placeholder="123"
                           pattern="[0-9]{3}" inputmode="numeric" required>
                </div>
            </div>

            <button type="submit" class="btn w-100 text-white border-0"
                    style="background-color: #CC0033; --bs-btn-hover-bg: #b3002d;">
                Pay Now
            </button>
        </form>
    </div>
</div>

</body>
</html>
