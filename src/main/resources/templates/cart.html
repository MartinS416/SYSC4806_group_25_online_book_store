<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Your Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- the navigation bar-->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #CC0033;">
    <div class="container">
        <a class="navbar-brand" href="#">Online Bookstore</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/shop">Shop</a></li>
                <li class="nav-item"><a class="nav-link active" href="/cart">Cart</a></li>
            </ul>
        </div>
    </div>
</nav>
<div style="display: flex; align-items: flex-start; justify-content: center; gap: 40px; margin-top: 20px; flex-wrap: wrap;">
    <div>
        <h1>Your Cart</h1>
        <table border="1" cellpadding="5">
            <thead>
            <tr>
                <th>Title</th><th>Qty</th><th>Price ($)</th><th>Subtotal ($)</th><th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${items}">
                <td th:text="${entry.key.title}"></td>
                <td th:text="${entry.value}"></td>
                <td th:text="${#numbers.formatDecimal(entry.key.price,1,2)}"></td>
                <td th:text="${#numbers.formatDecimal(entry.key.price * entry.value,1,2)}"></td>
                <td>
                    <form th:action="@{'/cart/remove/' + ${entry.key.id}}" method="post">
                        <button type="submit">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <h3>Total: <span th:text="${#numbers.formatDecimal(total,1,2)}"></span> $</h3>

        <p><a th:href="@{/books}">Continue Shopping</a></p>
        <form th:action="@{/cart/clear}" method="post">
            <button type="submit">Clear Cart</button>
        </form>
    </div>

    <div>
        <form th:action="@{/cart/pay}" method="post" class="p-4 rounded shadow-sm bg-white" style="max-width: 400px;">
            <h5 class="mb-3 text-center">Payment Details</h5>

            <div class="mb-3">
                <label for="cardNumber" class="form-label">Card Number</label>
                <input type="text" class="form-control" id="cardNumber" maxlength="16" placeholder="1234 5678 9012 3456"
                       pattern="[0-9\s]{13,19}" inputmode="numeric" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="expiry" class="form-label">Expiry</label>
                    <input type="text" class="form-control" id="expiry" placeholder="MM/YY"
                           pattern="(0[1-9]|1[0-2])\/?([0-9]{2})" inputmode="numeric" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="cvv" class="form-label">CVV</label>
                    <input type="text" class="form-control" id="cvv" maxlength="3" placeholder="123"
                           pattern="[0-9]{3}" inputmode="numeric" required>
                </div>
            </div>

            <button type="submit" class="btn w-100 text-white border-0"
                    style="background-color: #CC0033; --bs-btn-hover-bg: #b3002d;">
                Pay Now
            </button>
        </form>
    </div>
</div>

</body>
</html>
