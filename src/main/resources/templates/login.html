<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login or Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Define brand color */
        :root {
            --brand-red: #CC0033;
            --brand-red-hover: #b3002d;
        }

        /* Set the red background for the entire page */
        body {
            background-color: var(--brand-red);
        }

        /* --- Flipped Navbar Style --- */
        .navbar-light .navbar-brand,
        .navbar-light .nav-link {
            color: var(--brand-red);
        }
        .navbar-light .nav-link.active,
        .navbar-light .nav-link:hover {
            color: var(--brand-red-hover);
            font-weight: 500;
        }

        /* --- Card Style --- */
        .card {
            border: none;
            border-radius: 1rem;
        }

        /* --- Custom Pill Slider Style --- */
        .nav-pills {
            background-color: #f1f2f6; /* Light gray track for the slider */
            border-radius: 50rem;
        }

        .nav-pills .nav-link {
            color: #576574; /* Color for inactive text */
            border-radius: 50rem;
            padding: .75rem 1rem;
        }

        /* Style for the active "pill" */
        .nav-pills .nav-link.active {
            background-color: var(--brand-red);
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Online Bookstore</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/shop}">Shop</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cart}">Cart</a></li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">Sign In / Sign Up</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/logout}">Sign Out</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content Area -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 56px);">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg">
            <div class="card-body p-5">

                <!-- Pill Slider -->
                <ul class="nav nav-pills nav-fill mb-4" id="pills-tab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab" aria-controls="pills-login" aria-selected="true">Login</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab" aria-controls="pills-register" aria-selected="false">Register</button>
                    </li>
                </ul>

                <div class="tab-content" id="pills-tabContent">
                    <!-- Login Form -->
                    <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="pills-login-tab">
                        <form th:action="@{/login}" method="post">
                            <h3 class="text-center mb-4">Welcome Back</h3>

                            <div class="form-floating mb-3">
                                <input type="email" id="loginEmail" name="username" class="form-control" placeholder="name@example.com" required/>
                                <label for="loginEmail">Email address</label>
                            </div>

                            <div class="form-floating mb-4">
                                <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Password" required/>
                                <label for="loginPassword">Password</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-3 text-white border-0 fw-bold" style="background-color: var(--brand-red); --bs-btn-hover-bg: var(--brand-red-hover);">
                                Sign In
                            </button>
                        </form>
                    </div>

                    <div class="tab-pane fade" id="pills-register" role="tabpanel" aria-labelledby="pills-register-tab">
                        <form th:action="@{/register}" method="post">
                            <h3 class="text-center mb-4">Create Account</h3>

                            <div class="form-floating mb-3">
                                <input type="text" id="registerUsername" name="username" class="form-control" placeholder="Username" required/>
                                <label for="registerUsername">Username</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="email" id="registerEmail" name="email" class="form-control" placeholder="name@example.com" required/>
                                <label for="registerEmail">Email</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" id="registerPassword" name="password" class="form-control" placeholder="Password" required/>
                                <label for="registerPassword">Password</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-3 text-white border-0 fw-bold"
                                    style="background-color: var(--brand-red); --bs-btn-hover-bg: var(--brand-red-hover);">
                                Register
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
