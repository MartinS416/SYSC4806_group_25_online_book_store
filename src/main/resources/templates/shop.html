<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Book Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- the navigation bar-->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #CC0033;">
    <div class="container">
        <a class="navbar-brand" href="#">
    <span th:if="${#authorization.expression('isAuthenticated()')}"
          th:text="${#authentication.principal.displayName + '’s Online Bookstore'}">
    </span>

            <span th:if="${#authorization.expression('!isAuthenticated()')}">
        Online Bookstore
    </span>
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="/shop">Shop</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart">Cart</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/login}">Sign In / Sign Up</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- This is the list of books -->
<div class="container mt-4">
    <h2 class="mb-3">Available Books</h2>

    <!-- If there are no books -->
    <p th:if="${#lists.isEmpty(books)}" class="text-muted">No books available.</p>

    <!-- Here we display the books -->
    <div class="row" th:if="${!#lists.isEmpty(books)}">
        <div class="col-md-4 mb-3" th:each="b : ${books}">
            <div class="card h-110 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${b.title}">Book Title</h5>
                    <p class="card-text">
                        <strong>Author:</strong> <span th:text="${b.author}">Author</span><br>
                        <strong>Price:</strong> $<span th:text="${b.price}">0.00</span><br>
                        <strong>Category:</strong> <span th:text="${b.category}">Category</span><br>
                        <strong>Stock:</strong> <span th:text="${b.stock}">0</span>
                    </p>

                    <!-- ✅ NEW LINE: Link to view book details -->
                    <a th:href="@{'/books/' + ${b.id}}" class="btn btn-outline-dark w-50 mb-2">View Details</a>

                    <form th:action="@{'/cart/add/' + ${b.id}}" method="post">
                        <button type="submit" class="btn w-50 text-white border-0" style="background-color: #CC0033; --bs-btn-hover-bg: #b3002d;">Add to Cart</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<p th:if="${param.paid}" class="alert alert-success text-center">
    Payment successful! Thank you for your purchase.
</p>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
