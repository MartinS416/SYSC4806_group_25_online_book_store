<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${book.id} != null ? 'Edit Book' : 'Add Book'">Book Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        :root {
            --brand-red: #CC0033;
            --brand-red-hover: #b3002d;
        }
        .btn-brand {
            background-color: var(--brand-red);
            border: none;
        }
        .btn-brand:hover {
            background-color: var(--brand-red-hover);
        }
    </style>
</head>

<body>
<!-- ADMIN NAVBAR -->
<nav class="navbar navbar-expand-lg" style="background-color: #CC0033;">
    <div class="container-fluid">

        <a class="navbar-brand text-white fw-bold" th:href="@{/admin}">
            Admin Panel
        </a>

        <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse"
                data-bs-target="#adminNavbar" aria-controls="adminNavbar" aria-expanded="false">
            <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbar">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/admin/dashboard}">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/admin/books}">Books</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/admin/customers}">Users</a>
                </li>

            </ul>

            <!-- Logout / Profile -->
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/logout}">Logout</a>
                </li>
            </ul>

        </div>
    </div>
</nav>
<h2 class="mb-4" th:text="${book.id} != null ? 'Edit Book' : 'Add New Book'"></h2>

<form th:action="@{/admin/books}" th:object="${book}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="form-label">Title</label>
        <input class="form-control" th:field="*{title}" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Author</label>
        <input class="form-control" th:field="*{author}" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Price</label>
        <input type="number" name="price" min="0.01" step="0.01" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>
        <input class="form-control" th:field="*{category}" />
    </div>

    <div class="mb-3">
        <label class="form-label">Stock</label>
        <input type="number" name="stock" min="0" step="1" required>
    </div>

    <button type="submit" class="btn btn-brand text-white">Save</button>
    <a href="/admin/books" class="btn btn-secondary">Cancel</a>

</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
