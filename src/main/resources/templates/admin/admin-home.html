<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --brand-red: #CC0033;
            --brand-red-hover: #b3002d;
        }
        body {
            background-color: #f8f9fa;
        }
        .admin-header {
            background-color: var(--brand-red);
            color: white;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 30px;
        }
        .card:hover {
            transform: translateY(-3px);
            transition: 0.2s ease-in-out;
        }
        .btn-brand {
            background-color: var(--brand-red);
            border: none;
        }
        .btn-brand:hover {
            background-color: var(--brand-red-hover);
        }
    </style>
</head>

<body class="container py-4">

<div class="admin-header text-center">
    <h1>Admin Dashboard</h1>
    <p class="mb-0">Manage the bookstore system</p>
</div>

<div class="alert alert-success text-center" th:if="${message}" th:text="${message}"></div>

<div class="row g-4">

    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h3 class="card-title">Dashboard</h3>
                <p>Overview of sales, books, and system stats.</p>
                <a class="btn btn-brand text-white" th:href="@{/admin/dashboard}">
                    Go to Dashboard
                </a>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h3 class="card-title">Books</h3>
                <p>View, add, edit, and delete books.</p>
                <a class="btn btn-brand text-white"
                   th:href="@{/admin/books}">
                    Manage Books
                </a>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h3 class="card-title">Users</h3>
                <p>Overview of users and their information</p>
                <a class="btn btn-brand text-white" th:href="@{/admin/customers}">
                    Go to Users
                </a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
