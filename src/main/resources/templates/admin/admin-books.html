<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --brand-red: #CC0033;
            --brand-red-hover: #b3002d;
        }
        .btn-brand {
            background-color: var(--brand-red);
            border: none;
        }
        .btn-brand:hover {
            background-color: var(--brand-red-hover);
        }
    </style>
</head>

<body class="container py-4">

<h1 class="mb-4">Manage Books</h1>

<a class="btn btn-brand text-white mb-3" th:href="@{/admin/books/new}">
    + Add New Book
</a>

<!-- Books Table -->
<table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
        <th style="width: 25%;">Title</th>
        <th style="width: 25%;">Author</th>
        <th style="width: 15%;">Price</th>
        <th style="width: 20%;">Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.price}"></td>

        <td>
            <a th:href="@{'/admin/books/edit/' + ${book.id}}"
               class="btn btn-warning btn-sm me-2">
                Edit
            </a>


            <button class="btn btn-danger btn-sm"
                    data-bs-toggle="modal"
                    th:attr="data-bs-target='#deleteModal-' + ${book.id}">
                Delete
            </button>

            <div class="modal fade"
                 th:id="'deleteModal-' + ${book.id}"
                 tabindex="-1"
                 aria-hidden="true">

                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">Confirm Delete</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            Are you sure you want to delete:
                            <strong th:text="${book.title}"></strong>?
                        </div>

                        <div class="modal-footer">
                            <button class="btn btn-secondary"
                                    data-bs-dismiss="modal">Cancel</button>

                            <a th:href="@{'/admin/books/delete/' + ${book.id}}"
                               class="btn btn-danger">
                                Yes, Delete
                            </a>
                        </div>

                    </div>
                </div>
            </div>

        </td>
    </tr>
    </tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
