<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body >
<!-- ADMIN NAVBAR -->
<nav class="navbar navbar-expand-lg" style="background-color: #CC0033;">
    <div class="container-fluid">

        <a class="navbar-brand text-white fw-bold" th:href="@{/admin}">
            Admin Panel
        </a>

        <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse"
                data-bs-target="#adminNavbar" aria-controls="adminNavbar" aria-expanded="false">
            <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbar">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/admin/dashboard}">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/admin/books}">Books</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/admin/customers}">Users</a>
                </li>

            </ul>

            <!-- Logout / Profile -->
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/logout}">Logout</a>
                </li>
            </ul>

        </div>
    </div>
</nav>
<h2 th:text="${customer.id == null} ? 'Add Customer' : 'Edit Customer'"></h2>

<form th:action="@{/admin/customers}" th:object="${customer}" method="post" class="mt-3">

    <input type="hidden" th:field="*{id}"/>

    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Username</label>
            <input class="form-control"
                   th:field="*{username}"
                   required
                   minlength="3"
                   maxlength="32"
                   pattern="[A-Za-z0-9_]+"
                   title="Username must be 3-32 characters using letters, numbers, or underscores.">
        </div>

        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input class="form-control"
                   type="email"
                   th:field="*{email}"
                   required
                   maxlength="100"
                   title="Enter a valid email address.">
        </div>
    </div>


    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">First Name</label>
            <input class="form-control"
                   th:field="*{firstName}"
                   required
                   minlength="2"
                   maxlength="50"
                   pattern="[A-Za-z\s\-']+"
                   title="Name can only contain letters, spaces, hyphens, and apostrophes.">
        </div>

        <div class="col-md-6">
            <label class="form-label">Last Name</label>
            <input class="form-control"
                   th:field="*{lastName}"
                   required
                   minlength="2"
                   maxlength="50"
                   pattern="[A-Za-z\s\-']+"
                   title="Name can only contain letters, spaces, hyphens, and apostrophes.">
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input class="form-control"
                   th:field="*{phone}"
                   type="tel"
                   required
                   minlength="10"
                   maxlength="15"
                   pattern="[0-9]+"
                   title="Phone must contain only numbers and be 10–15 digits.">
        </div>

        <div class="col-md-6">
            <label class="form-label">Role</label>
            <select class="form-select" th:field="*{role}" required>
                <option value="">-- Select Role --</option>
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>
    </div>

    <div class="mb-3" th:if="${customer.id == null}">
        <label class="form-label">Password</label>
        <input class="form-control"
               type="password"
               th:field="*{password}"
               required
               minlength="6"
               maxlength="64"
               title="Password must be at least 6 characters.">
    </div>

    <button class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" th:href="@{/admin/customers}">Cancel</a>

</form>

</body>
</html>
