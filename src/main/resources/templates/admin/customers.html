<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Customer List</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
        background-color: #f8f9fa;
    }

    /* Sidebar */
    .sidebar {
        width: 240px;
        height: 100vh;
        background: #ffffff;
        border-right: 1px solid #dee2e6;
        padding: 20px;
        position: fixed;
    }

    .sidebar h5 {
        font-size: 1rem;
        margin-bottom: 16px;
        color: #333;
    }

    .sidebar a {
        display: block;
        padding: 8px 0;
        color: #555;
        text-decoration: none;
    }

    .sidebar a:hover {
        color: #000;
    }

    /* Main Content */
    .content {
        margin-left: 260px;
        padding: 20px;
    }

    .table thead th {
        background-color: #f1f3f5;
        font-weight: 600;
    }

    .table td, .table th {
        vertical-align: middle;
        padding: 8px;
    }

    .btn-light-border {
        border: 1px solid #ced4da;
        background: white;
    }

    .btn-light-border:hover {
        background: #f1f1f1;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h5>Search Customers</h5>
  <form th:action="@{/admin/customers}" method="get">
    <div class="input-group mb-4">
      <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Search name/email">
      <button class="btn btn-secondary" type="submit">Go</button>
    </div>
  </form>

  <a th:href="@{/admin/books}">Book List</a>
  <a th:href="@{/admin/customers}">Customer List</a>

  <hr>
</div>

<div class="content">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="fw-semibold">Customer List</h2>

    <div class="d-flex gap-2">
      <a class="btn btn-primary btn-sm"
         th:href="@{/admin/customers/new}">
        + Add Customer
      </a>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle small">
      <thead>
      <tr>
        <th style="width: 15%;">Username</th>
        <th style="width: 20%;">Email</th>
        <th style="width: 15%;">First Name</th>
        <th style="width: 15%;">Last Name</th>
        <th style="width: 15%;">Phone</th>
        <th style="width: 10%;">Role</th>
        <th style="width: 10%;">Actions</th>
      </tr>
      </thead>

      <tbody>
      <tr th:each="cust : ${customers}">
        <td th:text="${cust.username}"></td>
        <td th:text="${cust.email}"></td>
        <td th:text="${cust.firstName}"></td>
        <td th:text="${cust.lastName}"></td>
        <td th:text="${cust.phone}"></td>
        <td th:text="${cust.role}"></td>

        <td>
          <a th:href="@{'/admin/customers/edit/' + ${cust.id}}"
             class="btn btn-warning btn-sm">Edit</a>

          <button class="btn btn-danger btn-sm"
                  data-bs-toggle="modal"
                  th:attr="data-bs-target='#deleteModal-' + ${cust.id}">
            Delete
          </button>

          <div class="modal fade"
               th:id="'deleteModal-' + ${cust.id}"
               tabindex="-1" aria-hidden="true">

            <div class="modal-dialog">
              <div class="modal-content">

                <div class="modal-header">
                  <h5 class="modal-title">Confirm Delete</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                  Are you sure you want to delete customer:
                  <strong th:text="${cust.email}"></strong>?
                </div>

                <div class="modal-footer">
                  <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

                  <a th:href="@{'/admin/customers/delete/' + ${cust.id}}"
                     class="btn btn-danger">Yes, Delete</a>
                </div>

              </div>
            </div>
          </div>

        </td>
      </tr>
      </tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
