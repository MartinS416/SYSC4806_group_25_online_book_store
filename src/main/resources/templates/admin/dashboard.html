<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --brand-red: #CC0033;
            --brand-red-hover: #b3002d;
        }

        body {
            background-color: #f8f9fa;
        }

        .admin-header {
            background-color: var(--brand-red);
            color: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .card {
            border-radius: 10px;
        }

        .card:hover {
            transform: translateY(-3px);
            transition: .2s ease-in-out;
        }

        .section-title {
            margin-top: 40px;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body class="container py-4">

<div class="admin-header text-center">
    <h1>Admin Dashboard</h1>
    <p class="mb-0">Revenue, sales, and analytics</p>
</div>

<div class="card shadow-sm p-4 mb-5">
    <h3 class="mb-3">Daily Revenue</h3>
    <canvas id="revenueChart" height="100"></canvas>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/

    const dailyRevenue = /*[[${dailyRevenue}]]*/ [];

    const labels = dailyRevenue.map(d => d.date);
    const values = dailyRevenue.map(d => d.revenue);

    new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: "Revenue per Day",
                data: values,
                borderWidth: 3,
                borderColor: 'rgb(204, 0, 51)',
                backgroundColor: 'rgba(204, 0, 51, 0.2)',
                tension: 0.3
            }]
        }
    });

    /*]]>*/
</script>

<h3 class="section-title">Top Selling Books</h3>
<div class="card shadow-sm p-3">
    <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
        <tr>
            <th>Book</th>
            <th>Units Sold</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${topBooks}">
            <td th:text="${book.title}"></td>
            <td th:text="${book.units}"></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
