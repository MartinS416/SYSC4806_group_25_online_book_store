<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --brand-red: #CC0033;
            --brand-red-hover: #b3002d;
        }

        body {
            background-color: #f8f9fa;
        }

        .admin-header {
            background-color: var(--brand-red);
            color: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .card {
            border-radius: 10px;
        }

        .card:hover {
            transform: translateY(-3px);
            transition: .2s ease-in-out;
        }

        .section-title {
            margin-top: 40px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* SCROLLABLE CHART */
        .scroll-chart-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
        }

        /* Make the chart wider so horizontal scrolling is enabled */
        #revenueChart {
            min-width: 1200px;
        }
    </style>
</head>

<body class="container py-4">

<!-- HEADER -->
<div class="admin-header text-center">
    <h1>Admin Dashboard</h1>
    <p class="mb-0">Revenue, sales, and analytics</p>
</div>

<!-- DAILY REVENUE -->
<div class="card shadow-sm p-4 mb-5">
    <h3 class="mb-3">Daily Revenue</h3>

    <div class="scroll-chart-container">
        <canvas id="revenueChart" height="100"></canvas>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/

    const dailyRevenue = /*[[${dailyRevenue}]]*/ [];

    // Extract full data
    const allLabels = dailyRevenue.map(d => d.date);
    const allValues = dailyRevenue.map(d => d.revenue);

    // Limit visible range to last X days
    const MAX_VISIBLE_DAYS = 30;
    const startIndex = Math.max(0, allLabels.length - MAX_VISIBLE_DAYS);

    const labels = allLabels.slice(startIndex);
    const values = allValues.slice(startIndex);

    new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: "Revenue per Day",
                data: values,
                borderWidth: 3,
                borderColor: 'rgb(204, 0, 51)',
                backgroundColor: 'rgba(204, 0, 51, 0.2)',
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

    /*]]>*/
</script>

<!-- TOP BOOKS -->
<h3 class="section-title">Top Selling Books</h3>
<div class="card shadow-sm p-3">
    <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
        <tr>
            <th>Book</th>
            <th>Units Sold</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${topBooks}">
            <td th:text="${book.title}"></td>
            <td th:text="${book.units}"></td>
        </tr>
        </tbody>
    </table>
</div>

<!-- RECENT ORDERS -->
<h3 class="section-title">Recent Orders</h3>

<div class="card shadow-sm p-3" style="max-height: 350px; overflow-y: auto;">
    <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
        <tr>
            <th>Order ID</th>
            <th>Email</th>
            <th>Date</th>
            <th>Total</th>
            <th>Address</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}"></td>

            <td th:text="${o.email}"></td>

            <td th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}"></td>

            <td>$<span th:text="${o.totalAmount}"></span></td>

            <td th:text="${o.address.street + ', ' + o.address.city}"></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
