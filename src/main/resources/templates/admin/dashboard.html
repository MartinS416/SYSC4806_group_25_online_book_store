<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --brand-red: #CC0033;
            --brand-red-hover: #b3002d;
        }

        body {
            background-color: #f8f9fa;
        }

        .admin-header {
            background-color: var(--brand-red);
            color: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .card {
            border-radius: 10px;
        }

        .card:hover {
            transform: translateY(-3px);
            transition: .2s ease-in-out;
        }

        .section-title {
            margin-top: 40px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .scroll-chart-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
        }

        #revenueChart {
            min-width: 1200px;
        }
    </style>
</head>

<body>
<!-- ADMIN NAVBAR -->
<nav class="navbar navbar-expand-lg" style="background-color: #CC0033;">
    <div class="container-fluid">

        <a class="navbar-brand text-white fw-bold" th:href="@{/admin}">
            Admin Panel
        </a>

        <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse"
                data-bs-target="#adminNavbar" aria-controls="adminNavbar" aria-expanded="false">
            <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbar">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/admin/dashboard}">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/admin/books}">Books</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/admin/customers}">Users</a>
                </li>

            </ul>

            <!-- Logout / Profile -->
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/logout}">Logout</a>
                </li>
            </ul>

        </div>
    </div>
</nav>
<!-- HEADER -->
<div class="container-fluid px-0">
    <div class="py-4 px-4 mb-4"
         style="color: black; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;">
        <h2 class="fw-bold mb-1">Admin Dashboard</h2>
        <span class="opacity-75">Revenue, sales, and analytics</span>
    </div>
</div>

<!-- DAILY REVENUE -->
<div class="card shadow-sm p-4 mb-5">
    <h3 class="mb-3">Daily Revenue</h3>

    <div class="scroll-chart-container">
        <canvas id="revenueChart" height="100"></canvas>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/

    const dailyRevenue = /*[[${dailyRevenue}]]*/ [];

    const allLabels = dailyRevenue.map(d => d.date);
    const allValues = dailyRevenue.map(d => d.revenue);

    const MAX_VISIBLE_DAYS = 30;
    const startIndex = Math.max(0, allLabels.length - MAX_VISIBLE_DAYS);

    const labels = allLabels.slice(startIndex);
    const values = allValues.slice(startIndex);

    new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: "Revenue per Day",
                data: values,
                borderWidth: 3,
                borderColor: 'rgb(204, 0, 51)',
                backgroundColor: 'rgba(204, 0, 51, 0.2)',
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

    /*]]>*/
</script>

<!-- TOP BOOKS -->
<h3 class="section-title">Top Selling Books</h3>
<div class="card shadow-sm p-3">
    <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
        <tr>
            <th>Book</th>
            <th>Units Sold</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${topBooks}">
            <td th:text="${book.title}"></td>
            <td th:text="${book.units}"></td>
        </tr>
        </tbody>
    </table>
</div>

<!-- RECENT ORDERS -->
<h3 class="section-title">Recent Orders</h3>

<!-- FILTER BAR -->
<form class="card shadow-sm p-3 mb-3" method="get" th:action="@{/admin/dashboard}">
    <div class="row g-3 align-items-end">

        <div class="col-md-4">
            <label class="form-label fw-semibold">Search</label>
            <input type="text" class="form-control" name="keyword" placeholder="Order ID, Email, Address…" th:value="${keyword}">
        </div>

        <div class="col-md-3">
            <label class="form-label fw-semibold">Status</label>
            <select class="form-select" name="status" th:value="${status}">
                <option value="">All Statuses</option>
                <option value="NEW">New</option>
                <option value="PAID">Paid</option>
                <option value="SHIPPED">Shipped</option>
                <option value="CANCELLED">Cancelled</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label fw-semibold">From Date</label>
            <input type="date" class="form-control" name="from" th:value="${from}">
        </div>

        <div class="col-md-2 d-grid">
            <button class="btn btn-primary fw-semibold" style="background-color: var(--brand-red); border:none;">
                Apply Filters
            </button>
        </div>
    </div>
</form>

<!-- ORDERS TABLE -->
<div class="card shadow-sm p-3" style="height: 500px; overflow-y: auto; width: 100%;">
    <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
        <tr>
            <th>Order ID</th>
            <th>Email</th>
            <th>Date</th>
            <th>Status</th>
            <th>Total</th>
            <th>Address</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="o : ${orders}"
            class="order-row"
            style="cursor: pointer;"
            th:data-orderid="${o.id}">

            <td th:text="${o.id}"></td>
            <td th:text="${o.email}"></td>
            <td th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td><span class="badge bg-secondary" th:text="${o.status}"></span></td>
            <td>$<span th:text="${o.totalAmount}"></span></td>
            <td th:text="${o.address.street + ', ' + o.address.city}"></td>

        </tr>
        </tbody>
    </table>
</div>

<!-- ORDER DETAILS MODAL -->
<div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Order Details – #<span id="modalOrderId"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <table class="table table-striped mb-0">
                    <thead>
                    <tr>
                        <th>Book</th>
                        <th>Qty</th>
                        <th>Price</th>
                        <th>Subtotal</th>
                    </tr>
                    </thead>
                    <tbody id="orderItemsBody"></tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {

        document.querySelectorAll(".order-row").forEach(row => {
            row.addEventListener("click", async () => {

                const id = row.dataset.orderid;

                // Fetch order items via AJAX
                const response = await fetch(`/admin/orders/${id}/items`);
                const items = await response.json();

                document.getElementById("modalOrderId").textContent = id;

                const body = document.getElementById("orderItemsBody");
                body.innerHTML = "";

                items.forEach(line => {
                    body.innerHTML += `
                        <tr>
                            <td>${line.title}</td>
                            <td>${line.quantity}</td>
                            <td>$${line.price}</td>
                            <td>$${line.subtotal}</td>
                        </tr>
                    `;
                });

                new bootstrap.Modal(document.getElementById("orderModal")).show();
            });
        });

    });
</script>

</body>
</html>
